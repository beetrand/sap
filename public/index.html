<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AWSアーキテクチャ学習用の模擬ECサイト" />
    <title>SAP Commerce Lab</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#products" aria-label="商品一覧へ">SAP Commerce Lab</a>
      <nav aria-label="メインナビゲーション">
        <a href="#products">商品</a>
        <a href="#cart">カート <span id="cart-count" class="badge">0</span></a>
        <a href="#orders">注文履歴</a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <p class="eyebrow">PHASE 1 · BASIC ARCHITECTURE</p>
        <h1>設計を、動くシステムで学ぶ。</h1>
        <p>AWS Solutions Architect Professionalの実践学習用ストアです。決済は発生しません。</p>
      </section>

      <section id="products" class="panel" aria-labelledby="products-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">CATALOG</p>
            <h2 id="products-title">商品一覧</h2>
          </div>
          <p id="product-status" role="status">読み込み中…</p>
        </div>
        <div id="product-list" class="product-grid"></div>
      </section>

      <section id="cart" class="panel" aria-labelledby="cart-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">LOCAL CART</p>
            <h2 id="cart-title">カート</h2>
          </div>
          <strong id="cart-total">¥0</strong>
        </div>
        <div id="cart-items" class="stack"></div>
        <button id="checkout-button" class="primary" type="button">模擬注文を確定する</button>
        <p id="checkout-status" class="message" role="status"></p>
      </section>

      <section id="orders" class="panel" aria-labelledby="orders-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">HISTORY</p>
            <h2 id="orders-title">注文履歴</h2>
          </div>
          <button id="refresh-orders" class="secondary" type="button">更新</button>
        </div>
        <div id="order-list" class="stack"><p class="empty">注文履歴はありません。</p></div>
      </section>
    </main>

    <dialog id="product-dialog">
      <button class="dialog-close" type="button" aria-label="閉じる">×</button>
      <img id="dialog-image" alt="" />
      <p class="eyebrow">PRODUCT DETAIL</p>
      <h2 id="dialog-name"></h2>
      <p id="dialog-description"></p>
      <strong id="dialog-price"></strong>
      <button id="dialog-add" class="primary" type="button">カートに追加</button>
    </dialog>

    <footer>Learning environment — no real payment is processed.</footer>
  </body>
</html>
